[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redirect-manager"
version = "1.0.0"
description = "Validate, test, and export HTTP redirect rules locally."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["redirects", "nginx", "apache", "netlify", "seo", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
redirect-manager = "redirect_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
